name: Package and release

# Push a tag (e.g. v1.0.0) to package the addon and attach the zip to a GitHub release. Once the CurseForge
# project exists, add "## X-Curse-Project-ID: <id>" to the TOC and a CF_API_KEY repository secret, and the same
# run uploads to CurseForge.
on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
